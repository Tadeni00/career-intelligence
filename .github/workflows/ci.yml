name: CI quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-safety:
    name: Local deployment safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Compose loopback-only published ports
        run: python -m unittest discover -s deployment_checks -v
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

  backend:
    name: Python tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U career -d career"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://career:career@localhost:5433/career_test
      AI_PROVIDER: offline
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint CI deployment checks (blocking)
        run: ruff check deployment_checks
      - name: Audit existing application/test lint debt (non-blocking)
        continue-on-error: true
        run: ruff check apps packages tests
      - name: Backend tests (isolated PostgreSQL service)
        run: python -m pytest
      - name: Read-only frozen-artifact fingerprints
        if: always()
        run: python deployment_checks/frozen_artifact_probe.py

  frontend:
    name: TypeScript build and focused routing tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (includes TypeScript checking)
        run: npm run build
      - name: Application destination checks
        run: node --experimental-strip-types src/applicationUrl.test.ts
      - name: Tailored-CV route isolation checks
        run: node --experimental-strip-types src/tailoredCvRouting.test.ts
      - name: Job discovery triage checks
        run: node --experimental-strip-types src/discoveryTriage.test.ts
      - name: Job application readiness checks
        run: node --experimental-strip-types src/applicationReadiness.test.ts
