[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-intelligence"
version = "0.1.0"
description = "Evidence-driven career intelligence platform (V1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.core", "app.db", "app.models", "app.schemas", "app.services", "app.ai", "matching"]
package-dir = { "" = "apps/api", "matching" = "packages/matching/matching" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "packages/matching"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false