server {
  listen 4173;
  listen [::]:4173;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: react-router paths must serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxied API: the browser never needs to know a hostname, so this works
  # on the same machine as well as over a VM/container IP.
  location /api/ {
    proxy_pass http://api:8011;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
